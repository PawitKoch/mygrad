[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mygrad"
version = "0.1.0"
description = "A personal learning project implementing automatic differentiation from scratch using NumPy"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Pawit Koch", email = "" }
]
license = { text = "MIT" }

dependencies = [
    "numpy>=2.4.1",
    "matplotlib>=3.8",
    "jax[cpu]>=0.8.2",
    "optax>=0.1.4",
    "networkx>=3.6.1"
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2",
]
